<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorebound</title>
<meta name="description" content="Every WoW Forever quest by zone, and your own rings and badges from the Lorebound addon.">
<meta name="theme-color" content="#0e0d11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/qrcode.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <a class="wordmark" href="/">Lorebound</a>
  <nav>
    <a href="/" data-nav="quests">Quests</a>
    <a href="/me" data-nav="me">My progress</a>
    <a href="/report" data-nav="report">Report</a>
  </nav>
</header>
<div class="shell">
  <div class="search" id="find"><input type="search" id="search" placeholder="Search quests by name" aria-label="Search quests by name"></div>
  <main id="page" tabindex="-1"><p class="muted pad">Loading the quest list...</p></main>
  <aside id="side" aria-label="Zones"></aside>
</div>
<footer class="foot">
  Lorebound is an addon for WoW Forever. Quest data from QuestieDB, Zquest, Quest Completist, CMaNGOS,
  Wowhead's tooltips and players' reports; maps, paintings and parchment from the game. Not affiliated with Blizzard.
</footer>
</body>
</html>
