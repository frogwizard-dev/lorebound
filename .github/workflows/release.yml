# Builds Lorebound (with Lorebound_Data and the three Lorebound_Text parts beside it, see .pkgmeta) and publishes it whenever a
# version tag (v1.2.3) is pushed, or when the weekly quest list update (update.yml) makes one: a GitHub release
# always, and CurseForge once the repository has a CF_API_KEY secret (the .toc has the project ID).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The version tag to release (v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      # Patch notes: only this version's "## x.y.z" section of CHANGELOG.md, which the packager sends as the
      # CurseForge changelog and the GitHub release's text. Fails the release rather than publish it with no notes.
      - name: Patch notes for this version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            { sub(/\r$/, "") }
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > RELEASE_NOTES.md
          if ! grep -q . RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          cat RELEASE_NOTES.md
      # Built and tested for WoW Forever only, so uploads are tagged with Forever's game version on CurseForge
      # (1.60.1, its interface 16001), not the retail 12.x versions also in the .toc.
      - uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1
